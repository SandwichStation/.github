name: Sync profile readme to root

on:
  push:
    branches: [main]
    paths:
      - "profile/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy profile readme to root with warning
        run: |
          # Prepend warning comment to a copy of profile/readme.md
          cat > readme.md << 'EOF'
          <!--
            DO NOT EDIT THIS FILE DIRECTLY.
            This is an auto-generated copy for the Forgejo profile mirror.
            Edit 'profile/readme.md' instead — changes here will be overwritten.
          -->
          EOF
          cat profile/readme.md >> readme.md

          if git diff --quiet; then
            echo "No changes detected, skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme.md
          git commit -m "chore: sync profile readme to root [skip ci]"
          git push
